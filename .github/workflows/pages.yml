name: Publish project page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_site.py'
      - 'tutorial/**'
      - 'extensions/image/tutorial/**'
      - 'ide/assets/smallcpp_128.png'
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Generate project page and bilingual lessons
        run: python3 tools/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/project-page

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
